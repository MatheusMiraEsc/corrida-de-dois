<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida dos Dois - Jogo</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <main class="container-jogo">

        <header class="cabecalho-jogo">
            <h1>🏁 Corrida dos Dois</h1>
            <p id="vez-atual" class="indicador-vez">Vez de: —</p>
        </header>

        <section class="placar" aria-label="Placar dos jogadores">
            <div class="painel-jogador" id="painel-jogador1">
                <h2 id="nome-jogador1">Jogador 1</h2>
                <p>Posição: <span id="posicao-jogador1">0</span></p>
            </div>

            <div class="painel-jogador" id="painel-jogador2">
                <h2 id="nome-jogador2">Jogador 2</h2>
                <p>Posição: <span id="posicao-jogador2">0</span></p>
            </div>
        </section>

        <section class="area-pista" aria-label="Pista de corrida">
            <div class="pista" id="pista">
                <div class="carrinho carrinho-jogador1" id="carrinho1">🏎️</div>
                <div class="carrinho carrinho-jogador2" id="carrinho2">🚗</div>
                <div class="linha-chegada" id="linha-chegada">🏁</div>
            </div>
        </section>

        <section class="area-dado" aria-label="Controle do dado">
            <p class="resultado-dado" id="resultado-dado">Resultado: —</p>
            <button type="button" id="botao-rolar" class="botao-principal">
                🎲 Rolar dado
            </button>
        </section>

        <section class="area-informacoes">
            <div class="bloco-lista" aria-labelledby="titulo-eventos">
                <h2 id="titulo-eventos">Últimos acontecimentos</h2>
                <ul id="lista-eventos" class="lista-eventos"></ul>
            </div>

            <div class="bloco-tabela" aria-labelledby="titulo-historico">
                <h2 id="titulo-historico">Histórico de jogadas</h2>
                <table id="tabela-historico">
                    <thead>
                        <tr>
                            <th>Jogador</th>
                            <th>Dado</th>
                            <th>Movimento</th>
                            <th>Posição</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-historico"></tbody>
                </table>
            </div>
        </section>

        <section class="area-final oculto" id="area-final">
            <p class="mensagem-final" id="mensagem-final"></p>
            <button type="button" id="botao-reiniciar" class="botao-principal">
                Jogar novamente
            </button>
        </section>

    </main>

    <script src="js/jogador.js"></script>
    <script src="js/carrinho.js"></script>
    <script src="js/jogo.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
